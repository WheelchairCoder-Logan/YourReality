; ============================================================================
;  YourReality 运行配置模板
;  复制成本目录下的 config.ini 再用。真实 API Key 只写在你自己的 config.ini，
;  那文件已被 .gitignore 挡住、不会进版本库——别把真 Key 提交进来。
; ============================================================================

[LLM]
BaseUrl = https://apihub.agnes-ai.cn/v1/chat/completions
ApiKey = <在此粘贴你的 Key>
Model = agnes-2.5-flash
Temperature = 0.950000
TimeoutSec = 180
Stream = 1
SplitAsset = 1

[Game]
Zoom = 1.250000
TextSpeed = 40
PlayerName = 你
CharName = 常陆茉子
Trait = 上流忍者
LastChar = 茉子
Syllabus = C语言入门五章
; 0=默认走导演模式（大脑①，需 Key）；1=强制角色专属确定性剧本（大脑②里层，不依赖 Key）
ForceScript = 0

[Audio]
Volume = 700
